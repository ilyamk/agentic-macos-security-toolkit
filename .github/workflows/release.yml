name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build:
    name: Verify and package source
    if: github.event.repository.private == false && github.ref_protected
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release ancestry and install test tools
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor "refs/tags/$TAG^{commit}" refs/remotes/origin/main
          ./tools/ci/install-tools.sh "$RUNNER_TEMP/msc-bin" jq shellcheck gitleaks
          printf '%s\n' "$RUNNER_TEMP/msc-bin" >> "$GITHUB_PATH"
      - run: make test-fast
      - run: ./tools/ci/scan-git-secrets.sh
      - name: Create archive and checksum
        env:
          TAG: ${{ github.ref_name }}
        run: ./tools/ci/build-release.sh "$TAG" "$RUNNER_TEMP/msc-release"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/msc-release/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Attest and draft GitHub release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write # Create and attach files to the draft release.
      attestations: write # Store build provenance in the repository.
      id-token: write # Sign the provenance using the workflow identity.
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/msc-release
      - name: Verify archive checksum
        working-directory: ${{ runner.temp }}/msc-release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          name="agentic-macos-security-toolkit-$TAG.tar.gz"
          expected=$(sha256sum -- "$name")
          test "$(cat -- "$name.sha256")" = "$expected"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/msc-release/agentic-macos-security-toolkit-${{ github.ref_name }}.tar.gz
      - name: Create draft release
        working-directory: ${{ runner.temp }}/msc-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          name="agentic-macos-security-toolkit-$TAG.tar.gz"
          gh release create --verify-tag --draft --generate-notes -- "$TAG" "$name" "$name.sha256"
